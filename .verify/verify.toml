[verify]
commands = [
  "bash .verify/checks/route_drift.sh",
  "AUTONOMIC_BUDGET_GATE=0 cargo test -p agent-spine",
  "cargo clippy -p agent-spine -- -D warnings",
  "cargo check -p agent-spine",
  "sh .verify/checks/require_tests.sh --test engine_tests",
  "sh .verify/checks/require_tests.sh --test execution_control_tests",
  "sh .verify/checks/require_tests.sh --test wake_on_call_tests",
  "sh .verify/checks/require_tests.sh budget_gate",
  "sh .verify/checks/require_tests.sh --test budget_halt_tests",
  ".verify/playbooks/verify_budget_preconditions.sh",
  ".verify/playbooks/verify_workflow_engine.sh",
  ".verify/playbooks/verify_full_suite.sh",
]

[verify.default]
command = ["sh", ".verify/checks/require_tests.sh", "budget_gate"]
timeout_secs = 600
