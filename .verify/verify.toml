[verify]
commands = [
  "cargo test -p thesmos",
  "cargo clippy -p thesmos -- -D warnings",
  "cargo check -p thesmos",
  "sh .verify/checks/require_tests.sh --test engine_tests",
  "sh .verify/checks/require_tests.sh --test execution_control_tests",
  "sh .verify/checks/require_tests.sh --test wake_on_call_tests",
  ".verify/playbooks/verify_workflow_engine.sh",
  ".verify/playbooks/verify_full_suite.sh",
]
